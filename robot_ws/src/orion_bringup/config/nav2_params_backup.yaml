###############################################################
# ARES Navigation2 Parameters
###############################################################

map_server:
  ros__parameters:

    use_sim_time: true

    yaml_filename: ""

###############################################################
# AMCL
###############################################################

amcl:
  ros__parameters:

    use_sim_time: true

    base_frame_id: "base_link"
    odom_frame_id: "odom"
    global_frame_id: "map"

    scan_topic: "/scan"

    tf_broadcast: true

    set_initial_pose: false

    transform_tolerance: 1.0

    min_particles: 500
    max_particles: 2000

    update_min_d: 0.25
    update_min_a: 0.20

    resample_interval: 1

    laser_model_type: "likelihood_field"

###############################################################
# Lifecycle Manager
###############################################################

lifecycle_manager_localization:
  ros__parameters:

    use_sim_time: true

    autostart: true

    node_names:
      - map_server
      - amcl
