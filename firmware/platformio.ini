; ORION firmware. Two environments:
;   native   - host unit tests of the portable core:  pio test -e native
;   teensy41 - example board target (UNVERIFIED, pins unconfirmed): pio run -e teensy41
; The CMake build in CMakeLists.txt runs the same tests without PlatformIO and is the path
; verified in development; see firmware/README.md.

[platformio]
default_envs = teensy41

[env]
build_unflags = -std=gnu++11 -std=gnu++14
build_flags = -std=gnu++17 -Wall -Wextra

[env:native]
platform = native
test_framework = googletest
; Only the libraries in lib/ are under test; src/ is board code.
build_src_filter = -<*>
test_build_src = no
lib_compat_mode = off

[env:teensy41]
platform = teensy
board = teensy41
framework = arduino
extra_scripts = pre:tools/git_hash.py
test_ignore = *
